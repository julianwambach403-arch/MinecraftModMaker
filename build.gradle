plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'java'
}

version = project.mod_version
group = project.maven_group
base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	mods {
		"baritoneplus" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Already Mojmap-mapped Meteor Baritone build for 26.2. Compile against it,
	// then nest the original jar so the result is one standalone Fabric mod.
	compileOnly files("libs/baritone-meteor-26.2.jar")

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	from("libs") {
		include "baritone-meteor-26.2.jar"
		into "META-INF/jars"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
	from("LICENSE-BARITONE") {
		rename { "LICENSE_baritone" }
	}
}

tasks.register('copyRelease', Copy) {
	dependsOn remapJar
	from remapJar.archiveFile
	into 'releases'
}

tasks.named('build').configure {
	finalizedBy tasks.named('copyRelease')
}
