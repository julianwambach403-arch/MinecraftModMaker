<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShaderCreator – Shaderpack-Studio für Minecraft</title>
  <meta name="description" content="Erstelle Minecraft-Shaderpacks (OptiFine/Iris) per Klick – ohne Programmierkenntnisse. Create Minecraft shaderpacks visually.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232b9d55'/><text x='50' y='68' font-size='52' text-anchor='middle'>✨</text></svg>">
</head>
<body>
  <header>
    <div class="logo">✨</div>
    <div class="title-block">
      <h1 data-i18n="app.title">ShaderCreator</h1>
      <p data-i18n="app.subtitle">Shaderpack-Studio für Minecraft · OptiFine &amp; Iris</p>
    </div>
    <div class="header-spacer"></div>
    <div class="header-actions">
      <select id="language-select" aria-label="Sprache / Language">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
      <button class="btn primary" id="export-button-header">
        <span>⬇</span> <span data-i18n="header.export">Shaderpack exportieren</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav id="nav"></nav>

    <main id="panels"></main>

    <aside class="preview-column">
      <div class="preview-header">
        <h3 data-i18n="preview.title">Live-Vorschau</h3>
        <span data-i18n="preview.note">Näherung der Effekte</span>
      </div>
      <div class="preview-frame">
        <canvas id="preview-canvas"></canvas>
      </div>
      <div class="preview-controls">
        <div class="row">
          <label data-i18n="preview.time">Tageszeit</label>
          <input type="range" id="time-slider" min="0" max="1" step="0.002" value="0.35">
          <span class="time-label" id="time-label">Mittag</span>
        </div>
        <div class="preview-checks">
          <label><input type="checkbox" id="animate-time"> <span data-i18n="preview.animate">Zeit läuft</span></label>
          <label><input type="checkbox" id="auto-rotate" checked> <span data-i18n="preview.autorotate">Kamera dreht sich</span></label>
        </div>
      </div>
    </aside>
  </div>

  <div id="toasts"></div>

  <input type="file" id="project-file-input" accept=".json,application/json" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
